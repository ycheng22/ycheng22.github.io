name: Build and deploy to GitHub Pages

on:
  push:
    # run a build only for feature branches and the gh-pages branch
    branches:
      - 'feature/**'
      - 'gh-pages'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build (all branches)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate blog index
        run: npm run gen-index

      - name: Build (production)
        run: npm run build

      - name: Create .nojekyll file
        run: touch ./docs/.nojekyll

      - name: Upload build artifact (for later deploy)
        uses: actions/upload-artifact@v4
        with:
          name: docs-artifact
          path: ./docs
          retention-days: 1

      - name: Report build success as commit status (feature branches)
        if: ${{ github.ref != 'refs/heads/gh-pages' }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'CI/build',
              description: `Build succeeded for ${context.ref.replace('refs/heads/','')}`,
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });

  merge-to-gh-pages:
    name: Merge to gh-pages (feature branches only)
    needs: build
    if: ${{ github.ref != 'refs/heads/gh-pages' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout gh-pages branch or create it
        run: |
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git fetch origin gh-pages:gh-pages || true
            git checkout gh-pages
            git pull origin gh-pages || true
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

      - name: Merge feature branch into gh-pages
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          git merge origin/$BRANCH_NAME --no-edit --allow-unrelated-histories || git merge origin/$BRANCH_NAME --no-edit
          git push origin gh-pages

  upload-pages-artifact:
    name: Prepare Pages artifact (gh-pages only)
    needs: build
    if: ${{ github.ref == 'refs/heads/gh-pages' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-artifact
          path: ./docs

      - name: Ensure .nojekyll exists
        run: touch ./docs/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy-pages:
    name: Deploy to GitHub Pages (gh-pages only)
    needs: upload-pages-artifact
    if: ${{ github.ref == 'refs/heads/gh-pages' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
