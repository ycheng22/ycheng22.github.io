name: Build and deploy to GitHub Pages

on:
  push:
    # run a build only for feature branches and the gh-pages branch
    branches:
      - 'feature/**'
      - 'gh-pages'
  workflow_dispatch: {}

jobs:
  build:
    name: Build (all branches)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Generate blog index
        run: npm run gen-index

      - name: Build (production)
        run: npm run build

      - name: Upload build artifact (for later deploy)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-artifact
          path: ./docs

      - name: Report build success as commit status (feature branches)
        if: ${{ github.ref != 'refs/heads/gh-pages' }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'CI/build',
              description: `Build succeeded for ${context.ref.replace('refs/heads/','')}`,
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });

  upload-pages-artifact:
    name: Prepare Pages artifact (gh-pages only)
    needs: build
    if: ${{ github.ref == 'refs/heads/gh-pages' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: docs-artifact
          path: ./docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./docs

  deploy-pages:
    name: Deploy to GitHub Pages (gh-pages only)
    needs: upload-pages-artifact
    if: ${{ github.ref == 'refs/heads/gh-pages' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
