<div class="min-h-screen bg-slate-50 dark:bg-slate-950">
  <!-- Back Navigation -->
  <div class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
    <div class="container-custom py-4">
      <div class="max-w-4xl mx-auto">
        <a
          routerLink="/blog"
          class="inline-flex items-center text-accent-600 dark:text-accent-400 hover:text-accent-700 dark:hover:text-accent-300 font-medium transition-colors"
        >
          <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
          Back to Blog
        </a>
      </div>
    </div>
  </div>

  <!-- Blog Post Content -->
  <div class="container-custom py-8">
    <div class="w-full mx-auto">
      @if (blogPost(); as post) {
      <div class="bg-white dark:bg-slate-900 rounded-lg shadow-sm border border-slate-200 dark:border-slate-800 p-2 md:p-2">
        <app-blog-post [blogPost]="post"></app-blog-post>
      </div>
      } @else if (loading()) {
      <div class="bg-white dark:bg-slate-900 rounded-lg shadow-sm border border-slate-200 dark:border-slate-800 p-2 md:p-2">
        <div class="animate-pulse">
          <div class="h-8 bg-slate-200 dark:bg-slate-700 rounded mb-4"></div>
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded mb-2"></div>
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded mb-2"></div>
          <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded mb-8"></div>
          <div class="h-32 bg-slate-200 dark:bg-slate-700 rounded"></div>
        </div>
      </div>
      }

      <!-- Post Not Found -->
      @if (postNotFound()) {
      <div class="bg-white dark:bg-slate-900 rounded-lg shadow-sm border border-slate-200 dark:border-slate-800 p-2 md:p-2 text-center">
        <div class="text-6xl mb-4">📄</div>
        <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-4">Post Not Found</h2>
        <p class="text-slate-600 dark:text-slate-400 mb-6">
          The blog post you're looking for doesn't exist or has been moved.
        </p>
        <a routerLink="/blog" class="btn-primary"> Back to Blog </a>
      </div>
      }
    </div>
  </div>

        </p>
      </div>
    </div>
  </div> -->
</div>
