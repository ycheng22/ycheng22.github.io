<section id="about" class="section">
  <h2 class="section-title">About</h2>
  <p class="section-lead">Languages I speak and the places that shaped me.</p>

  <!-- Languages I Speak (moved unchanged from the previous home page) -->
  <section class="py-6 bg-gradient-to-br from-gray-50 to-purple-50 dark:from-slate-950 dark:to-slate-950 rounded-2xl">
    <div class="container-custom">
      <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl p-8">
        <div class="text-center mb-12">
          <div
            class="w-16 h-16 bg-gradient-to-br from-sky-100 to-blue-100 rounded-full flex items-center justify-center mx-auto mb-4"
          >
            <svg class="w-8 h-8 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"
              ></path>
            </svg>
          </div>
          <h3 class="text-3xl font-bold text-gray-900 dark:text-white mb-4">Languages I Speak</h3>
          <p class="text-lg text-gray-600 dark:text-slate-400">
            Multilingual communication skills for global collaboration
          </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 max-w-4xl mx-auto">
          <!-- Chinese -->
          <div
            class="bg-gradient-to-r from-red-50 to-orange-50 rounded-xl p-6 border border-red-200 dark:from-slate-800 dark:to-slate-800 dark:border-slate-700 hover:shadow-lg transition-shadow duration-300"
          >
            <div class="flex items-center mb-4">
              <div
                class="w-12 h-12 rounded-full overflow-hidden mr-4 shadow-md border-2 border-white"
              >
                <img loading="lazy" decoding="async"
                  src="https://flagcdn.com/w80/cn.png"
                  alt="China Flag"
                  class="w-full h-full object-cover"
                />
              </div>
              <div>
                <h4 class="text-lg font-semibold text-gray-900 dark:text-white">Chinese</h4>
                <p class="text-sm text-gray-600 dark:text-slate-400">中文</p>
              </div>
            </div>
            <div class="flex items-center justify-between">
              <span
                class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-800"
              >
                Native
              </span>
            </div>
          </div>

          <!-- English -->
          <div
            class="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-xl p-6 border border-blue-200 dark:from-slate-800 dark:to-slate-800 dark:border-slate-700 hover:shadow-lg transition-shadow duration-300"
          >
            <div class="flex items-center mb-4">
              <div
                class="w-12 h-12 rounded-full overflow-hidden mr-4 shadow-md border-2 border-white"
              >
                <img loading="lazy" decoding="async"
                  src="https://flagcdn.com/w80/us.png"
                  alt="USA Flag"
                  class="w-full h-full object-cover"
                />
              </div>
              <div>
                <h4 class="text-lg font-semibold text-gray-900 dark:text-white">English</h4>
                <p class="text-sm text-gray-600 dark:text-slate-400">English</p>
              </div>
            </div>
            <div class="flex items-center justify-between">
              <span
                class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800"
              >
                Fluent
              </span>
            </div>
          </div>

          <!-- French -->
          <div
            class="bg-gradient-to-r from-indigo-50 to-purple-50 rounded-xl p-6 border border-indigo-200 dark:from-slate-800 dark:to-slate-800 dark:border-slate-700 hover:shadow-lg transition-shadow duration-300"
          >
            <div class="flex items-center mb-4">
              <div
                class="w-12 h-12 rounded-full overflow-hidden mr-4 shadow-md border-2 border-white"
              >
                <img loading="lazy" decoding="async"
                  src="https://flagcdn.com/w80/fr.png"
                  alt="France Flag"
                  class="w-full h-full object-cover"
                />
              </div>
              <div>
                <h4 class="text-lg font-semibold text-gray-900 dark:text-white">French</h4>
                <p class="text-sm text-gray-600 dark:text-slate-400">Français</p>
              </div>
            </div>
            <div class="flex items-center justify-between">
              <span
                class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-indigo-100 text-indigo-800"
              >
                Intermediate
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- My Global Journey (moved unchanged from the previous journey section) -->
  <div class="mt-10 rounded-2xl shadow-lg overflow-hidden bg-gradient-to-r from-blue-100 to-purple-100 dark:from-slate-900 dark:to-slate-800">
        <div class="text-center py-4">
          <h3 class="text-5xl font-bold text-gray-800 dark:text-slate-100 mb-0">My Global Journey</h3>
        </div>

        <!-- Map Area: use a container aspect-ratio that matches the SVG viewBox so the SVG scales uniformly and circles stay round -->
        <div
          class="relative w-full h-60 bg-gradient-to-r from-blue-100 to-purple-100 dark:from-slate-900 dark:to-slate-800 rounded-b-2xl overflow-hidden"
          style="aspect-ratio: 1000/300"
        >
          <div class="absolute inset-0 opacity-70">
            <svg viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet" class="w-full h-full">
              <!-- Dashed World Path -->
              <path
                d="M0 150 Q250 120 500 150 Q750 130 1000 150"
                stroke="#9333ea"
                stroke-width="3"
                fill="none"
                stroke-dasharray="6,6"
                class="animate-pulse"
              >
                <animate
                  attributeName="stroke-dashoffset"
                  values="0;12"
                  dur="2s"
                  repeatCount="indefinite"
                />
              </path>

              <!-- Location Pins -->
              <g font-family="Inter, Arial, sans-serif" font-size="14" class="fill-gray-700 dark:fill-slate-300">
                <!-- Beijing -->
                <circle cx="250" cy="130" r="8" fill="#ef4444">
                  <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite" />
                </circle>
                <text x="250" y="110" text-anchor="middle">Beijing</text>

                <!-- Houston -->
                <circle cx="375" cy="150" r="8" fill="#3b82f6">
                  <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite" />
                </circle>
                <text x="375" y="130" text-anchor="middle">Houston, TX</text>

                <!-- South Carolina -->
                <circle cx="562" cy="140" r="8" fill="#10b981">
                  <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite" />
                </circle>
                <text x="562" y="120" text-anchor="middle">South Carolina</text>

                <!-- Earth Icon -->
                <text x="750" y="160" text-anchor="middle" font-size="64" opacity-70>🌍</text>
              </g>
            </svg>
          </div>
        </div>
  </div>
</section>
