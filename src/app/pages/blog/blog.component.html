<div class="min-h-screen bg-gray-50">
  <!-- Header -->
  <div class="bg-gradient-to-br from-purple-600 via-purple-700 to-purple-800 text-white">
    <div class="container-custom py-16">
      <div class="max-w-4xl mx-auto text-center">
        <h1 class="text-4xl md:text-5xl font-bold mb-6">
          Technical Blog
        </h1>
        <p class="text-xl text-purple-100 max-w-3xl mx-auto leading-relaxed">
          Insights, tutorials, and thoughts on software engineering, web development, and modern technologies. 
          Join me as I share my experiences and learnings.
        </p>
      </div>
    </div>
  </div>

  <!-- Search Bar -->
  <div class="bg-white border-b border-gray-200">
    <div class="container-custom py-8">
      <div class="max-w-2xl mx-auto">
        <div class="relative">
          <input type="text" 
                 [(ngModel)]="searchTerm"
                 (input)="filterPosts()"
                 placeholder="Search articles..."
                 class="w-full pl-12 pr-4 py-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent text-lg">
          <svg class="absolute left-4 top-4 h-6 w-6 text-gray-400" 
               fill="none" 
               stroke="currentColor" 
               viewBox="0 0 24 24">
            <path stroke-linecap="round" 
                  stroke-linejoin="round" 
                  stroke-width="2" 
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Tags Filter -->
  <div class="bg-white border-b border-gray-200">
    <div class="container-custom py-6">
      <div class="max-w-6xl mx-auto">
        <div class="flex flex-wrap gap-3 justify-center">
          <button (click)="filterByTag('all')" 
                  [class.bg-purple-600]="selectedTag === 'all'"
                  [class.text-white]="selectedTag === 'all'"
                  [class.bg-gray-100]="selectedTag !== 'all'"
                  [class.text-gray-700]="selectedTag !== 'all'"
                  class="px-4 py-2 rounded-lg font-medium transition-colors hover:bg-purple-100 hover:text-purple-800">
            All
          </button>
          <button *ngFor="let tag of availableTags$ | async" 
                  (click)="filterByTag(tag)"
                  [class.bg-purple-600]="selectedTag === tag"
                  [class.text-white]="selectedTag === tag"
                  [class.bg-gray-100]="selectedTag !== tag"
                  [class.text-gray-700]="selectedTag !== tag"
                  class="px-4 py-2 rounded-lg font-medium transition-colors hover:bg-purple-100 hover:text-purple-800">
            {{ tag }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Blog Posts -->
  <div class="container-custom py-12">
    <div class="max-w-6xl mx-auto">

      <!-- Posts Grid -->
      <div *ngIf="filteredPosts$ | async as posts; else loadingTemplate">
        <div *ngIf="posts.length > 0; else noPostsTemplate" 
             class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
          <app-blog-card *ngFor="let post of posts" 
                         [blogPost]="post">
          </app-blog-card>
        </div>
        
        <ng-template #noPostsTemplate>
          <div class="text-center py-12">
            <div class="text-6xl mb-4">📝</div>
            <h3 class="text-xl font-semibold text-gray-900 mb-2">
              No posts match your search
            </h3>
            <p class="text-gray-600">
              Try adjusting your search terms or selecting a different tag.
            </p>
            <button (click)="filterByTag('all')"
                    class="mt-4 px-6 py-3 bg-purple-600 text-white font-medium rounded-lg hover:bg-purple-700 transition-colors duration-200">
              View All Posts
            </button>
          </div>
        </ng-template>
      </div>

      <ng-template #loadingTemplate>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
          <div *ngFor="let i of [1,2,3,4,5,6]" class="card animate-pulse">
            <div class="h-4 bg-gray-200 rounded mb-3"></div>
            <div class="h-3 bg-gray-200 rounded mb-2"></div>
            <div class="h-3 bg-gray-200 rounded mb-4"></div>
            <div class="h-3 bg-gray-200 rounded w-1/2"></div>
          </div>
        </div>
      </ng-template>

      <!-- Load More Button (if needed in future) -->
      <div *ngIf="(filteredPosts$ | async) as posts" 
           class="text-center mt-12">
        <p class="text-gray-600">
          Showing {{ posts.length }} posts
        </p>
      </div>
    </div>
  </div>
</div>
