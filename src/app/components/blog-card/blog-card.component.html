<article
  [ngClass]="{
    'bg-white rounded-lg shadow-md hover:shadow-lg transition-all duration-300 overflow-hidden group cursor-pointer':
      variant === 'default',
    'bg-white rounded-xl shadow-xl overflow-hidden lg:flex lg:items-stretch':
      variant === 'featured',
    'bg-white rounded-lg shadow-sm overflow-hidden': variant === 'compact'
  }"
  (click)="navigateToPost()"
>
  @if (variant !== 'compact') {
  <div class="relative h-48 overflow-hidden bg-gray-200">
    <img
      [src]="blogPost.background"
      alt="Blog Post Cover"
      class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
    />

    @if (blogPost.pinned) {
    <div class="absolute top-4 right-4 z-10">
      <span
        class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800 shadow-sm border border-yellow-200 backdrop-blur-sm bg-opacity-95"
      >
        <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
          <path
            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
          />
        </svg>
        Pinned
      </span>
    </div>
    }
  </div>
  }

  <div [ngClass]="{ 'p-6': variant !== 'featured', 'p-0': variant === 'featured' }">
    <div class="mb-3 flex flex-wrap gap-2">
      @for (tag of blogPost.tags; track tag) {
      <span
        class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800"
      >
        #{{ tag }}
      </span>
      }
    </div>

    <h3
      class="text-xl font-bold text-gray-900 mb-3 group-hover:text-gray-700 transition-colors duration-200 line-clamp-2"
    >
      {{ blogPost.title }}
    </h3>

    <p class="text-gray-600 text-sm mb-4 line-clamp-2 leading-relaxed">
      {{ blogPost.description || 'Read this article to learn more about this topic.' }}
    </p>

    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-4 text-sm text-gray-500">
        <span class="flex items-center">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
            ></path>
          </svg>
          {{ formatDate(blogPost.date) }}
        </span>
        <span class="flex items-center">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
            ></path>
          </svg>
          {{ blogPost.readingTime || 5 }} min read
        </span>
      </div>
    </div>

    <div class="mt-4 text-center">
      <button
        class="inline-flex items-center px-4 py-2 bg-white border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors duration-200 text-sm font-medium"
      >
        Read More
        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5l7 7-7 7"
          ></path>
        </svg>
      </button>
    </div>
  </div>
</article>
