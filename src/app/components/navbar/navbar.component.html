<nav
  class="sticky top-0 z-50 border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-950/80"
>
  <div class="max-w-[1100px] mx-auto px-4 sm:px-6">
    <div class="flex h-16 items-center justify-between">
      <!-- Brand -->
      <a routerLink="/" class="flex items-center gap-2.5 hover:opacity-80 transition-opacity" (click)="closeMenu()">
        <img src="/icon-192.png" width="28" height="28" alt="" class="h-7 w-7" />
        <span class="text-lg font-bold text-slate-900 dark:text-white">Cheng</span>
      </a>

      <!-- Desktop -->
      <div class="hidden md:flex items-center gap-1">
        @for (item of items; track item.label) {
          <a
            [routerLink]="item.route"
            [fragment]="item.fragment"
            class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 dark:text-slate-300 dark:hover:text-white dark:hover:bg-slate-800 transition-colors"
          >
            {{ item.label }}
          </a>
        }
        <ng-container *ngTemplateOutlet="themeToggle"></ng-container>
        <a [href]="links.linkedIn" target="_blank" rel="noopener" class="btn-primary ml-2 text-sm py-1.5">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path [attr.d]="icons.linkedIn" /></svg>
          LinkedIn
        </a>
      </div>

      <!-- Mobile controls -->
      <div class="flex items-center gap-1 md:hidden">
        <ng-container *ngTemplateOutlet="themeToggle"></ng-container>
        <button
          type="button"
          class="rounded-md p-2 text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"
          aria-controls="mobile-menu"
          [attr.aria-expanded]="mobileMenuOpen()"
          (click)="toggleMobileMenu()"
        >
          <span class="sr-only">Open main menu</span>
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            @if (mobileMenuOpen()) {
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            }
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile menu -->
  @if (mobileMenuOpen()) {
    <div id="mobile-menu" class="md:hidden border-t border-slate-200 dark:border-slate-800">
      <div class="max-w-[1100px] mx-auto px-4 py-3 space-y-1">
        @for (item of items; track item.label) {
          <a
            [routerLink]="item.route"
            [fragment]="item.fragment"
            (click)="closeMenu()"
            class="block rounded-md px-3 py-2 text-base font-medium text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-800"
          >
            {{ item.label }}
          </a>
        }
        <a [href]="links.linkedIn" target="_blank" rel="noopener" class="btn-primary w-full mt-2" (click)="closeMenu()">
          LinkedIn
        </a>
      </div>
    </div>
  }
</nav>

<ng-template #themeToggle>
  <button
    type="button"
    (click)="theme.toggle()"
    class="rounded-md p-2 text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 transition-colors"
    [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
  >
    @if (theme.theme() === 'dark') {
      <!-- Sun -->
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41" />
      </svg>
    } @else {
      <!-- Moon -->
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    }
  </button>
</ng-template>
