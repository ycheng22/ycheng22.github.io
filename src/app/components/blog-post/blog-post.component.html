<article class="blog-post-container mx-auto py-8 px-4 sm:px-6 lg:px-8">
  <!-- Scroll Navigation Component -->
  <app-scroll-navigation></app-scroll-navigation>

  <!-- Header -->
  <header class="mb-12 text-center">
    <h1 class="text-5xl font-bold text-gray-900 leading-tight mb-6">
      {{ blogPost.title }}
    </h1>

    <div class="mb-8 max-w-3xl mx-auto">
      <div
        class="bg-gradient-to-r from-blue-50 to-indigo-50 border-l-4 border-blue-500 rounded-lg px-6 py-5 shadow-sm hover:shadow-md transition-shadow duration-300"
      >
        <p class="text-lg text-gray-700 italic font-medium leading-relaxed">
          <svg
            class="w-5 h-5 text-blue-500 inline-block mr-3 mb-1"
            fill="currentColor"
            viewBox="0 0 20 20"
          >
            <path
              fill-rule="evenodd"
              d="M18 5v8a2 2 0 01-2 2h-5l-5 4v-4H4a2 2 0 01-2-2V5a2 2 0 012-2h12a2 2 0 012 2zm-11-1a1 1 0 11-2 0 1 1 0 012 0zm3 1a1 1 0 100-2 1 1 0 000 2zm2-1a1 1 0 11-2 0 1 1 0 012 0zm4 1a1 1 0 100-2 1 1 0 000 2z"
              clip-rule="evenodd"
            />
          </svg>
          {{ blogPost.description }}
        </p>
      </div>
    </div>

    <div class="flex items-center justify-center text-gray-500 text-sm mb-6">
      <div class="flex items-center mr-6">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
          ></path>
        </svg>
        <span>{{ formatDate(blogPost.date) }}</span>
      </div>
      <div class="flex items-center mr-6">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          ></path>
        </svg>
        <span>{{ blogPost.author }}</span>
      </div>
      <div class="flex items-center">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
        <span>{{ blogPost.readingTime || 5 }} min read</span>
      </div>
    </div>

    <div class="flex flex-wrap justify-center gap-2">
      @for (tag of blogPost.tags; track tag) {
      <span
        class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-gray-100 text-gray-700 hover:bg-blue-100 hover:text-blue-800 transition-colors duration-200"
      >
        #{{ tag }}
      </span>
      }
    </div>
  </header>

  <!-- Content -->
  <div class="markdown-content" #markdownContent>
    <markdown [data]="blogPost.content"> </markdown>
  </div>

  <!-- Footer -->
  <footer class="mt-16 pt-8 border-t border-gray-200">
    <div class="flex items-center justify-between">
      <a
        routerLink="/blog"
        class="inline-flex items-center px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors duration-200"
      >
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 19l-7-7m0 0l7-7m-7 7h18"
          ></path>
        </svg>
        Back to Blog
      </a>

      <div class="flex items-center space-x-4">
        <button
          class="inline-flex items-center px-4 py-2 text-gray-500 hover:text-gray-700 transition-colors duration-200"
        >
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"
            ></path>
          </svg>
          Share
        </button>

        <button
          class="inline-flex items-center px-4 py-2 text-gray-500 hover:text-gray-700 transition-colors duration-200"
        >
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
            ></path>
          </svg>
          Like
        </button>
      </div>
    </div>
  </footer>
</article>
