<article class="max-w-4xl mx-auto py-12 px-4 sm:px-6 lg:px-8 bg-white shadow-lg rounded-lg">
  <!-- Header -->
  <header class="mb-10 text-center">
    <h1 class="text-4xl font-extrabold text-gray-900 leading-tight mb-4">
      {{ blogPost.title }}
    </h1>
    <p class="text-gray-600 text-lg mb-4">
      {{ blogPost.description }}
    </p>
    <div class="flex items-center justify-center text-gray-500 text-sm">
      <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
      </svg>
      <span>{{ formatDate(blogPost.date) }}</span>
      <span class="mx-3">•</span>
      <span>{{ blogPost.author }}</span>
    </div>
    <div class="mt-4 flex flex-wrap justify-center gap-2">
      <span *ngFor="let tag of blogPost.tags" class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-purple-100 text-purple-800">
        #{{ tag }}
      </span>
    </div>
  </header>
  
  <!-- Content -->
  <div class="prose prose-lg max-w-none markdown-body">
    <markdown [data]="blogPost.content">
    </markdown>
  </div>
  
  <!-- Footer -->
  <footer class="mt-12 pt-8 border-t border-gray-200">
    <div class="flex items-center justify-between">
      <a routerLink="/blog" class="inline-flex items-center text-purple-600 hover:text-purple-800 transition-colors duration-200">
        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Back to Blog
      </a>
      <a href="#" class="inline-flex items-center text-gray-500 hover:text-gray-700 transition-colors duration-200">
        Share
        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path>
        </svg>
      </a>
    </div>
  </footer>
</article>
