<footer class="border-t border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-950">
  <div class="max-w-[1100px] mx-auto px-4 sm:px-6 py-8 flex flex-col sm:flex-row items-center justify-between gap-4">
    <p class="text-sm text-slate-500 dark:text-slate-400">© {{ currentYear() }} Cheng</p>
    <div class="flex items-center gap-4">
      <a [href]="links.linkedIn" target="_blank" rel="noopener" aria-label="LinkedIn"
        class="text-slate-500 hover:text-accent-600 dark:text-slate-400 dark:hover:text-accent-400 transition-colors">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path [attr.d]="icons.linkedIn" /></svg>
      </a>
      <a [href]="links.github" target="_blank" rel="noopener" aria-label="GitHub"
        class="text-slate-500 hover:text-accent-600 dark:text-slate-400 dark:hover:text-accent-400 transition-colors">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path [attr.d]="icons.github" /></svg>
      </a>
    </div>
  </div>
</footer>
